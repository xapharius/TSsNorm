[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tssnorm"
version = "1.1.0"
description = "Sigmoid-modulated, task-specific normalization for multi-task learning and implicit ensembles (TMLR)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mihai Suteu" },
    { name = "Ovidiu Serban" },
]
dependencies = ["torch>=1.12"]
keywords = ["multi-task learning", "ensembles", "uncertainty", "normalization", "pytorch"]

[project.optional-dependencies]
# tssnorm.mtl needs numpy + scipy; matplotlib is for the mtl/examples/ demo notebook.
analysis = ["numpy", "scipy", "matplotlib"]

[project.urls]
Paper = "https://openreview.net/forum?id=QNO893OXrS"

[tool.setuptools]
packages = ["tssnorm"]
