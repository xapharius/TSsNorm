# σN-Ens, WideResNet-28-10 on CIFAR-100, converted from a trained single model and fine-tuned.
# Set model.checkpoint to the single model's checkpoint.
seed_everything: false
eval_after_fit: true
trainer:
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  max_epochs: 25
  logger:
    class_path: lightning.pytorch.loggers.TensorBoardLogger
    init_args:
      save_dir: logs/cifar100/wideresnet28x10
      name: sigma_n_ens_finetune
      default_hp_metric: false
  callbacks:
    - class_path: torch_uncertainty.callbacks.TUClsCheckpoint
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/cls/Acc
        patience: 1000
        check_finite: true
model:
  num_classes: 100
  arch: wideresnet28x10
  num_estimators: 4
  tau: 0.1
  reg_weight: 1.0e-4
  reg_on: ["layer*.bn1"]
  checkpoint: path/to/single.ckpt
  eval_ood: true
  optimizer:
    class_path: torch.optim.Adam
    init_args:
      lr: 1.0e-3
      weight_decay: 1.0e-4
  lr_scheduler:
    class_path: torch.optim.lr_scheduler.CosineAnnealingLR
    init_args:
      T_max: 25
data:
  class_path: torch_uncertainty.datamodules.CIFAR100DataModule
  init_args:
    root: ./data
    batch_size: 128
    eval_ood: true
    num_workers: 4
    auto_augment: rand-m9-n2-mstd1
