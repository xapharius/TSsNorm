# Setup
version_name: TSsBN_pascal_vitSp16
out_dir: "./"
seed: 1

# Database
train_db_name: PASCALContext
val_db_name: PASCALContext
trBatch: 2
valBatch: 6
nworkers: 2
ignore_index: 255

# Optimizer and scheduler
intermediate_supervision: False
val_interval: 2000
epochs: 999999
max_iter: 60000
optimizer: adam
optimizer_kwargs:
   lr: 0.00002
   lr_bn_mul: 100
   lr_ln_mul: 10
   weight_decay: 0.000001
scheduler: poly
grad_clip_param: {'max_norm': 10, 'norm_type': 2}

# Model
model: TSsBN
backbone: vitS
head:  conv
msf:
   hidden: 512
   out: 192
   depth: 2
dropout_rate: 0.0
drop_path_rate: 0.0

# Tasks
task_dictionary:
   include_semseg: True
   include_human_parts: True
   include_sal: True
   include_edge: True
   include_normals: True
   edge_w: 0.95

# Loss kwargs
loss_kwargs:
   loss_weights:
       semseg: 1.0
       human_parts: 2.0
       sal: 5.0
       edge: 50.0
       normals: 10.0
